spring:
  application:
    name: movie-booking-backend
  # Connection settings come only from the environment (see .env.example); no defaults, so a
  # missing variable fails at startup instead of silently connecting somewhere unexpected.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
