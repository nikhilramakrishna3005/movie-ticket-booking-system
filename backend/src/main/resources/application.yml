spring:
  application:
    name: movie-booking-backend
  # Connection settings come only from the environment (see .env.example); no defaults, so a
  # missing variable fails at startup instead of silently connecting somewhere unexpected.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

booking:
  hold-ttl: 8m
  # Upper bound on any row-lock wait in hold transactions; exceeding it returns 409 SEATS_BUSY.
  lock-timeout: 2s
  # A payment is refused when the hold has less time left than this (docs/architecture.md §6.5).
  payment-min-remaining: 60s
  # A PENDING attempt older than this can no longer have a charge in flight and may be resolved.
  payment-timeout: 5s
  outbox:
    # Tests disable the scheduler and call OutboxDispatcher.dispatchDue() explicitly.
    enabled: true
    poll-interval: 2s
    batch-size: 20
    claim-lease: 30s
    backoff-initial: 1s
    backoff-max: 60s
    max-attempts: 8

server:
  # Honors X-Forwarded-* from a same-origin reverse proxy in front of the React app and the API.
  # The backend port must then only be reachable through that proxy.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
