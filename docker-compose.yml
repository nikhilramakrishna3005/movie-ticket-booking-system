# Local-only stack. Copy .env.example to .env and set values before running:
#   docker compose up --build
# Then open http://localhost:3000 (or FRONTEND_HOST_PORT). The API is served from the same
# origin under /api; the backend container is not published to the host.
# Clean start (drops the database volume):
#   docker compose down -v && docker compose up --build
name: movie-booking

services:
  postgres:
    # Keep in sync with TestcontainersConfiguration in the backend tests.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    # No published port: the backend trusts X-Forwarded-* headers (server.forward-headers-strategy),
    # so it must only be reachable through the frontend proxy.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
